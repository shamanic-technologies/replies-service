name: Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: integration-tests
  cancel-in-progress: true

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          REPLY_QUALIFICATION_SERVICE_API_KEY: test-api-key
          CHAT_SERVICE_URL: https://chat.test.local
          CHAT_SERVICE_API_KEY: test-chat-key
          RUNS_SERVICE_URL: https://runs.test.local
          RUNS_SERVICE_API_KEY: test-runs-key

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # Use the dev DB for both PRs and pushes. The previous Neon-branch-per-PR
      # setup pointed at a project ID that no longer exists in the Neon org, so
      # the action returned 404 on every run. The `concurrency` group above
      # serializes integration jobs, which keeps the shared dev DB safe.
      - name: Push schema to dev DB
        run: npx drizzle-kit push --force
        env:
          REPLY_QUALIFICATION_SERVICE_DATABASE_URL: ${{ secrets.REPLY_QUALIFICATION_SERVICE_DATABASE_URL_DEV }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          REPLY_QUALIFICATION_SERVICE_DATABASE_URL: ${{ secrets.REPLY_QUALIFICATION_SERVICE_DATABASE_URL_DEV }}
          REPLY_QUALIFICATION_SERVICE_API_KEY: test-api-key
          CHAT_SERVICE_URL: https://chat.test.local
          CHAT_SERVICE_API_KEY: test-chat-key
          RUNS_SERVICE_URL: https://runs.test.local
          RUNS_SERVICE_API_KEY: test-runs-key
