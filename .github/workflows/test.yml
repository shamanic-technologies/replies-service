name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          REPLIES_SERVICE_API_KEY: test-api-key
          RUNS_SERVICE_API_KEY: test-runs-key

  test-integration:
    runs-on: ubuntu-latest

    # One throwaway Postgres per run, private to this job's runner and destroyed
    # with it. No external service, no credentials, no cleanup step.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: replies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REPLIES_SERVICE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/replies_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      # Builds the schema the same way the service builds it at boot: replay the
      # drizzle journal. Throws on the first failing statement, so a migration
      # that cannot run against an empty database fails the job here.
      - name: Run migrations
        run: npx tsx scripts/ci-migrate.ts

      # The migrated database must match src/db/schema.ts. `drizzle-kit push`
      # exits 0 even when a statement fails, so the output is inspected rather
      # than the exit code: any diff or error means schema.ts and the journal
      # have drifted apart.
      - name: Verify schema matches the migration journal
        run: |
          set -o pipefail
          npx drizzle-kit push --force 2>&1 | tee push.log
          if grep -qi "^error:" push.log; then
            echo "::error::drizzle-kit reported an error while comparing the schema"
            exit 1
          fi
          if ! grep -q "No changes detected" push.log; then
            echo "::error::src/db/schema.ts has drifted from the migrations in drizzle/ — run 'npm run db:generate' and commit the migration"
            exit 1
          fi

      - name: Run integration tests
        run: npm run test:integration
        env:
          REPLIES_SERVICE_API_KEY: test-api-key
          RUNS_SERVICE_API_KEY: test-runs-key
